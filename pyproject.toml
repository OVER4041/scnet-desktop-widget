[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scnet-desktop-widget"
version = "0.1.0"
description = "Read-only Windows desktop monitor for SSH-accessible Slurm clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scnet-desktop-widget = "scnet_widget.widget:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scnet_widget"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/README.en.md", "/CHANGELOG.md", "/pyproject.toml", "/config.example.toml", "/widget.example.json", "/launch-widget.pyw", "/启动超算挂件.vbs"]
